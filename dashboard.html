<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terminal Cuantitativa · Inversión Digital</title>
<style>
  :root{
    --bg:#070b12; --panel:#0d1422; --panel2:#0a1019; --line:#1b2738; --line2:#243349;
    --txt:#e8eef7; --muted:#7e93ad; --dim:#56697f; --gold:#C5A059; --gold2:#e0bd7d;
    --green:#2dd4a7; --red:#ff6b6b; --blue:#5b9dff; --violet:#a78bfa;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,monospace;font-size:13px;line-height:1.4}
  a{color:var(--blue)}
  /* Top bar */
  .topbar{display:flex;justify-content:space-between;align-items:center;padding:14px 26px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0c1422,#070b12)}
  .brand{display:flex;align-items:center;gap:12px}
  .brand .dot{width:11px;height:11px;border-radius:3px;background:var(--gold);box-shadow:0 0 12px var(--gold)}
  .brand h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.5px}
  .brand h1 b{color:var(--gold)}
  .brand .sub{font-size:11px;color:var(--muted)}
  .statuspane{display:flex;gap:18px;align-items:center;font-size:12px}
  .pill{display:flex;align-items:center;gap:6px;padding:5px 11px;border:1px solid var(--line2);border-radius:8px;background:var(--panel2)}
  .live{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 9px var(--green);animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  button{background:var(--panel2);color:var(--txt);border:1px solid var(--line2);border-radius:8px;padding:6px 14px;font-family:inherit;font-size:12px;cursor:pointer;transition:.15s}
  button:hover{border-color:var(--gold);color:var(--gold)}
  /* KPI strip */
  .kpis{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
  .kpi{background:var(--panel);padding:13px 16px}
  .kpi .k{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px}
  .kpi .v{font-size:18px;font-weight:700;margin-top:4px}
  .kpi .v small{font-size:11px;color:var(--muted);font-weight:400}
  /* Layout */
  .wrap{display:grid;grid-template-columns:1fr 360px;gap:1px;background:var(--line)}
  .main{background:var(--bg);padding:18px 22px}
  .side{background:var(--bg);padding:18px 18px;display:flex;flex-direction:column;gap:18px}
  .section-title{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
  .section-title b{color:var(--gold)}
  /* Table */
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  thead th{position:sticky;top:0;background:#0b1320;color:var(--dim);font-weight:600;text-align:right;padding:9px 10px;border-bottom:1px solid var(--line2);font-size:11px;text-transform:uppercase;letter-spacing:.4px;cursor:default}
  thead th:first-child,tbody td:first-child{text-align:left}
  thead th.l{text-align:left}
  tbody td{padding:9px 10px;text-align:right;border-bottom:1px solid #121b29}
  tbody tr:hover{background:#0e1726}
  .sym{font-weight:700;font-size:13.5px}
  .sym small{display:block;color:var(--dim);font-size:10px;font-weight:400}
  .rank{color:var(--dim);font-size:11px;width:24px}
  .up{color:var(--green)}.down{color:var(--red)}
  .bar{height:6px;border-radius:4px;background:#16202f;position:relative;overflow:hidden;min-width:54px}
  .bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
  .tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:5px;border:1px solid var(--line2);color:var(--muted)}
  .tag.hi{color:var(--gold);border-color:var(--gold)}
  .tag.lo{color:var(--blue);border-color:var(--blue)}
  .scorecell{font-weight:700;font-size:14px;color:var(--gold2)}
  /* detail panel */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .card h3{margin:0 0 10px;font-size:13px;color:var(--gold)}
  .metric-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed #16202f;font-size:12px}
  .metric-row span:first-child{color:var(--muted)}
  .metric-row b{font-weight:600}
  /* expert panels */
  .expert{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:12px}
  .expert h3{margin:0 0 8px;font-size:13px;color:var(--gold)}
  .expert h4{margin:10px 0 4px;font-size:11.5px;color:var(--blue);text-transform:uppercase;letter-spacing:.5px}
  .expert table{font-size:11.5px}
  .expert td,.expert th{padding:4px 6px;border-bottom:1px solid #121b29}
  /* legend / footer */
  .footer{padding:16px 26px 60px;color:var(--dim);font-size:11px;line-height:1.7;border-top:1px solid var(--line);margin-top:1px;background:var(--panel2)}
  .footer b{color:var(--muted)}
  .loading{padding:50px;text-align:center;color:var(--muted)}
  .err{padding:26px;color:var(--red)}
  .sel{outline:1px solid var(--gold);background:#0e1726!important}
  /* plataformas */
  a.plat{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 13px;border:1px solid var(--line2);border-radius:9px;background:var(--panel2);text-decoration:none;color:var(--txt);transition:.15s}
  a.plat:hover{border-color:var(--gold);background:#0e1726;transform:translateY(-1px)}
  a.plat span{font-size:11.5px;color:var(--muted)}
  a.plat span b{color:var(--txt);font-size:13px}
  a.plat i{font-style:normal;font-size:10.5px;color:var(--gold);white-space:nowrap}
  /* Asistente IA modal */
  .btn-ia{background:linear-gradient(180deg,#C5A059,#a8843f);color:#1a1206;border:0;border-radius:8px;padding:7px 14px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:.15s}
  .btn-ia:hover{filter:brightness(1.12)}
  .ia-modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center}
  .ia-backdrop{position:absolute;inset:0;background:rgba(3,6,11,.72);backdrop-filter:blur(2px)}
  .ia-panel{position:relative;width:min(960px,94vw);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .ia-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
  .ia-head h2{margin:0;font-size:16px;color:var(--gold)}
  .ia-tag{font-size:10px;color:var(--red);border:1px solid var(--red);border-radius:6px;padding:2px 7px;margin-left:8px;font-weight:600;vertical-align:middle}
  .ia-x{background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer}
  .ia-body{padding:18px 20px}
  .ia-controls{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:12px}
  .ia-controls label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
  .ia-controls input,.ia-controls select{background:var(--panel2);border:1px solid var(--line2);color:var(--txt);border-radius:7px;padding:6px 9px;font-family:inherit;font-size:12px;width:130px}
  .ia-status{padding:8px 12px;background:#0a1019;border:1px solid var(--line);border-radius:8px;font-size:12px;color:var(--muted);margin-bottom:12px}
  .ia-result{font-size:13px;line-height:1.6}
  .ia-result .big{font-size:26px;font-weight:800;color:var(--gold2)}
  .ia-result .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
  .ia-result .cell{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px}
  .ia-result .cell b{display:block;font-size:18px;color:var(--txt)}
  .ia-result .cell span{font-size:10.5px;color:var(--dim)}
  .ia-log{margin-top:12px;max-height:140px;overflow:auto;font-size:11.5px;color:var(--muted);background:#0a1019;border:1px solid var(--line);border-radius:8px;padding:10px;line-height:1.7}
  .ia-warn{font-size:11px;color:var(--dim);margin-top:12px;line-height:1.6;border-top:1px solid var(--line);padding-top:10px}
  .ia-paused{color:var(--gold)!important}
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="dot"></div>
    <div>
      <h1>QUANT<b>TERMINAL</b> · Inversión Digital</h1>

<div class="kpis" id="kpis">

<div class="wrap">

      <div id="detailBody"><div style="color:var(--muted)">Selecciona una fila de la tabla.</div></div>

<div class="footer">
  <b>Metodología completa.</b> Universo: top-100 por capitalización con volumen 24h ≥ $10M, <b>excluyendo stablecoins</b> (no crecen el capital — detectado y corregido por el Experto en Datos: dominaban el score original por vol≈0).
  Momentum compuesto z-score = 0.4·z(24h)+0.3·z(7d)+0.2·z(30d)+0.1·z(1h) sobre el universo. Volatilidad proxy = |7d%|+0.5·|30d%|. Riesgo(1-10)=10·vol/max(vol). Asimetría Sharpe-like = momentum/(vol+ε), normalizada min-max. Liquidez = log10(volumen) normalizada.
  Score final = 0.50·asimetría + 0.35·liquidez + 0.15·sesgo(momentum crudo). Datos vivos: CoinGecko cada 60s.
  <br><br>
  <b>⚠ Aviso:</b> análisis cuantitativo, <b>NO asesoría financiera regulada</b>. "Rápida recuperación" = alta liquidez (salida en segundos) + momentum + posición pequeña. Cripto es volátil: puedes perder el capital. El score no es infalible — evalúa liquidez de rotación, no solo volumen absoluto.

<script>
const STABLE = new Set(['usdt','usdc','dai','ust','ustc','tusd','fdusd','usdd','usds','usd1','usdg','usde','pyusd','rlusd','gusd','busd','frax','lusd','susd','usdp','usdn','musd','usdx']);
const pct = x => (x==null?0:x);
let RATE_MXN=0; // tipo de cambio USD->MXN (vivo)
const fmtMXN = u => (RATE_MXN? '$'+ (u*RATE_MXN).toLocaleString('es-MX',{maximumFractionDigits:u<1?2:0})+' MXN' : '—');

function zscores(arr,key){const v=arr.map(d=>d[key]||0);const n=v.length;const m=v.reduce((a,b)=>a+b,0)/n;const s=Math.sqrt(v.reduce((a,b)=>a+(b-m)**2,0)/n)||1;return arr.map(d=>(d[key]-m)/s);}

let CURRENT=[], SELECTED=null;
let FAILS=0;                 // fallos consecutivos de conexion
let SOURCE='binance';        // fuente activa: binance | coingecko
let LAST_GOOD=null;          // ultimo snapshot bueno (para degradacion)

async function fetchJSON(url, ms=8000){
  const ctrl=new AbortController();
  const t=setTimeout(()=>ctrl.abort(),ms);
  try{ const r=await fetch(url,{signal:ctrl.signal,cache:'no-store'}); clearTimeout(t); return r; }
  catch(e){ clearTimeout(t); throw e; }
}

// Conexion primaria en tiempo real: Binance (1 llamada, todos los tickers)
async function fetchBinance(){
  const r=await fetchJSON('https://api.binance.com/api/v3/ticker/24hr',9000);
  if(!r.ok) throw new Error('Binance HTTP '+r.status);
  const all=await r.json();
  // filtrar pares USDT liquidos
  const rows=all.filter(x=>x.symbol.endsWith('USDT') && parseFloat(x.quoteVolume)>1e6)
    .map(x=>({
      symbol:x.symbol.replace('USDT',''),
      name:x.symbol.replace('USDT',''),
      id:x.symbol.toLowerCase(),
      current_price:parseFloat(x.lastPrice),
      market_cap:null, market_cap_rank:null,
      total_volume:parseFloat(x.quoteVolume), // en USDT = liquidez real
      high_24h:parseFloat(x.highPrice), low_24h:parseFloat(x.lowPrice),
      price_change_percentage_24h_in_currency:parseFloat(x.priceChangePercent),
      price_change_percentage_1h_in_currency:null,
      price_change_percentage_7d_in_currency:null,
      price_change_percentage_30d_in_currency:null
    }));
  return rows;
}

// Respaldo score completo: CoinGecko (cuando no esta bloqueado por 429)
async function fetchCoinGecko(){
  const r=await fetchJSON('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=100&page=1&price_change_percentage=1h,24h,7d,30d',9000);
  if(!r.ok) throw new Error('CoinGecko HTTP '+r.status);
  return (await r.json()).filter(d=>(d.total_volume||0)>=10e6 && !STABLE.has((d.symbol||'').toLowerCase()));
}

// Tipo de cambio MXN (fuente libre, no recarga CoinGecko)
async function fetchMXN(){
  try{
    const r=await fetchJSON('https://open.er-api.com/v6/latest/USD',6000);
    if(r.ok){ const j=await r.json(); RATE_MXN=(j.rates&&j.rates.MXN)||0; }
  }catch(e){ /* mantiene valor previo */ }
}

function connStatus(){
  const el=document.getElementById('status');
  if(FAILS===0) el.innerHTML='<span style="color:var(--green)">● En vivo</span> · '+SOURCE.toUpperCase();
  else if(FAILS<3) el.innerHTML='<span style="color:var(--gold)">◐ Reintentando</span> · '+SOURCE.toUpperCase()+' ('+FAILS+')';
  else el.innerHTML='<span style="color:var(--red)">● Reconectando…</span> · backoff';
}

async function load(){
  connStatus();
  let data;
  try{
    // 1) Binance siempre (tiempo real de precio/24h/volumen)
    const bin=await fetchBinance();
    SOURCE='binance';
    data=bin;
    // 2) Enriquecer con CoinGecko si esta disponible (cap, 7d, 30d, id real)
    try{
      const cg=await fetchCoinGecko();
      const map={}; cg.forEach(c=>map[(c.symbol||'').toUpperCase()]=c);
      data=data.map(b=>{ const c=map[b.symbol]; if(c){ return {...b,
        id:c.id, market_cap:c.market_cap, market_cap_rank:c.market_cap_rank,
        price_change_percentage_1h_in_currency:c.price_change_percentage_1h_in_currency,
        price_change_percentage_7d_in_currency:c.price_change_percentage_7d_in_currency,
        price_change_percentage_30d_in_currency:c.price_change_percentage_30d_in_currency }; } return b; });
      SOURCE='binance+cg';
    }catch(e){ /* CG caido: seguimos solo con Binance (score por 24h+vol) */ }
    FAILS=0;
  }catch(e){
    FAILS++;
    if(LAST_GOOD){ data=LAST_GOOD; connStatus();
      document.getElementById('status').innerHTML+=' <span style="color:var(--dim)">(usando último snapshot)</span>';
    } else {
      document.getElementById('status').textContent='Error de conexión: '+e.message;
      document.getElementById('tbl').innerHTML='<div class="err">⚠ Sin conexión a fuentes en vivo ('+e.message+'). Reintentando…</div>';
      scheduleRetry(); return;
    }
  }
  if(data && data.length) LAST_GOOD=data;
  // MXN en paralelo (no bloquea el ranking)
  fetchMXN();
  // scoring sobre lo disponible
  let uni=data.filter(d=>!STABLE.has((d.symbol||'').toLowerCase()));
  const has7d=uni.some(d=>d.price_change_percentage_7d_in_currency!=null);
  const z24=zscores(uni,'price_change_percentage_24h_in_currency');
  const z7=has7d?zscores(uni,'price_change_percentage_7d_in_currency'):uni.map(()=>0);
  const z30=has7d?zscores(uni,'price_change_percentage_30d_in_currency'):uni.map(()=>0);
  const z1=zscores(uni,'price_change_percentage_1h_in_currency');
  const vol=uni.map(d=>Math.abs(pct(d.price_change_percentage_7d_in_currency))+0.5*Math.abs(pct(d.price_change_percentage_30d_in_currency)) || Math.abs(pct(d.price_change_percentage_24h_in_currency)));
  const mv=Math.max(...vol,0.0001);
  const liq=uni.map(d=>Math.log10(d.total_volume||1));
  const lmin=Math.min(...liq),lmax=Math.max(...liq);
  const asym=uni.map((d,i)=>(0.4*z24[i]+0.3*z7[i]+0.2*z30[i]+0.1*z1[i])/(vol[i]+0.001));
  const aMin=Math.min(...asym),aMax=Math.max(...asym);
  const scored=uni.map((d,i)=>{
    const m=0.4*z24[i]+0.3*z7[i]+0.2*z30[i]+0.1*z1[i];
    const risk=10*vol[i]/mv;
    const rot=(d.total_volume||0)/(d.market_cap||1);
    const finalScore=0.50*((asym[i]-aMin)/((aMax-aMin)||1))+0.35*((liq[i]-lmin)/((lmax-lmin)||1))+0.15*(m/(Math.abs(m)+1));
    return {...d,m,vol:vol[i],risk,rot,finalScore,score100:finalScore*100};
  });
  scored.sort((a,b)=>b.finalScore-a.finalScore);
  CURRENT=scored;
  renderKPIs(scored,uni.length);
  renderTable(scored.slice(0,10));
  pushRT(scored);
  drawRT();
  document.getElementById('clock').textContent=new Date().toLocaleString('es-MX');
  connStatus();
}

// Backoff: si hay fallos, espera exponencial antes del proximo tick
function scheduleRetry(){
  const wait=Math.min(2000*Math.pow(2,FAILS),30000);
  clearInterval(MAIN_TIMER);
  setTimeout(()=>{ MAIN_TIMER=setInterval(load,2000); load(); }, wait);
}

// ---- Chart en tiempo real (serie 24h vía /market_chart, CORS abierto) ----
let CHART_ID=null, CHART_SERIES=[], CHART_TIMES=[], CHART_PRICE=null;
let CHART_VIEW={a:0,b:0}; // indices visibles (zoom)
let CHART_HOVER=-1;       // indice bajo el cursor
async function drawChart(coinId, currentPrice){
  const cv=document.getElementById('chartCanvas');
  const ld=document.getElementById('chartLoad');
  if(!coinId){cv.style.display='none';ld.style.display='none';return;}
  CHART_ID=coinId;
  cv.style.display='block';ld.style.display='block';
  let series,times;
  try{
    const r=await fetch("https://api.coingecko.com/api/v3/coins/"+coinId+"/market_chart?vs_currency=usd&days=1&interval=hourly",{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j=await r.json();
    series=(j.prices||[]).map(p=>p[1]);
    times=(j.prices||[]).map(p=>p[0]);
    if(!series.length) throw new Error('sin datos');
  }catch(e){ ld.textContent='⚠ chart 24h no disponible ('+e.message+') — usa el chart de sesión (Binance)'; cv.style.display='none'; return; }
  ld.style.display='none';
  CHART_SERIES=series; CHART_TIMES=times; CHART_PRICE=currentPrice;
  CHART_VIEW={a:0,b:series.length-1};
  bindChartEvents(cv);
  renderChart();
}

function renderChart(){
  const cv=document.getElementById('chartCanvas');
  if(!cv||!CHART_SERIES.length) return;
  const series=CHART_SERIES, times=CHART_TIMES;
  const a=CHART_VIEW.a, b=CHART_VIEW.b;
  const seg=series.slice(a,b+1);
  const tseg=times.slice(a,b+1);
  const min=Math.min(...seg), max=Math.max(...seg), pad=(max-min)*0.12||1;
  const W=cv.width,H=cv.height,padB=22,padT=10;
  const n=seg.length;
  const x=i=> a + i/(Math.max(1,n-1))*(W-2)+1; // i relativo al segmento
  const xa=i=> i/(series.length-1)*(W-2)+1;      // i absoluto (para hover mapping)
  const y=v=> padT+(1-(v-(min-pad))/(max+pad-(min-pad)))*(H-padB-padT);
  const ctx=cv.getContext('2d');
  ctx.clearRect(0,0,W,H);
  // grid
  ctx.strokeStyle='#16202f';ctx.lineWidth=1;
  for(let g=0;g<=4;g++){const yy=padT+g*(H-padB-padT)/4;ctx.beginPath();ctx.moveTo(0,yy);ctx.lineTo(W,yy);ctx.stroke();}
  // área
  const up=seg[seg.length-1]>=seg[0];
  const col=up?'#2dd4a7':'#ff6b6b';
  ctx.beginPath();ctx.moveTo(x(0),y(seg[0]));
  seg.forEach((v,i)=>ctx.lineTo(x(i),y(v)));
  ctx.lineTo(x(seg.length-1),H-padB);ctx.lineTo(x(0),H-padB);ctx.closePath();
  const grad=ctx.createLinearGradient(0,padT,0,H-padB);grad.addColorStop(0,up?'rgba(45,212,167,.28)':'rgba(255,107,107,.28)');grad.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=grad;ctx.fill();
  // línea precio
  ctx.beginPath();ctx.moveTo(x(0),y(seg[0]));seg.forEach((v,i)=>ctx.lineTo(x(i),y(v)));ctx.strokeStyle=col;ctx.lineWidth=2;ctx.stroke();
  // media móvil 7 (sobre segmento)
  const ma=seg.map((_,i)=>{const s=seg.slice(Math.max(0,i-6),i+1);return s.reduce((p,q)=>p+q,0)/s.length;});
  ctx.beginPath();ma.forEach((v,i)=>i?ctx.lineTo(x(i),y(v)):ctx.moveTo(x(i),y(v)));ctx.strokeStyle='#C5A059';ctx.lineWidth=1.4;ctx.setLineDash([4,3]);ctx.stroke();ctx.setLineDash([]);
  // eje Y labels
  ctx.fillStyle='#56697f';ctx.font='10px monospace';ctx.textAlign='left';
  ctx.fillText('$'+(max).toFixed(max<1?4:0),4,padT+9);
  ctx.fillText('$'+(min).toFixed(min<1?4:0),4,H-padB+2);
  // hover: linea vertical + punto + tooltip
  if(CHART_HOVER>=a && CHART_HOVER<=b){
    const idx=CHART_HOVER;
    const v=series[idx]; const hx=xa(idx); const hy=y(v);
    ctx.strokeStyle='#7e93ad';ctx.setLineDash([3,3]);ctx.beginPath();ctx.moveTo(hx,padT);ctx.lineTo(hx,H-padB);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle=col;ctx.beginPath();ctx.arc(hx,hy,3.5,0,7);ctx.fill();
    const hh=new Date(times[idx]).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
    const label='$'+v.toLocaleString('en-US',{maximumFractionDigits:v<1?4:2})+'  '+hh;
    ctx.font='11px monospace';const tw=ctx.measureText(label).width+12;
    let bx=hx+8; if(bx+tw>W) bx=hx-tw-8;
    ctx.fillStyle='rgba(10,16,25,.92)';ctx.strokeStyle='#243349';ctx.lineWidth=1;
    ctx.fillRect(bx,padT+2,tw,18);ctx.strokeRect(bx,padT+2,tw,18);
    ctx.fillStyle='#e8eef7';ctx.textAlign='left';ctx.fillText(label,bx+6,padT+15);
  }
  // marca precio actual
  if(CHART_PRICE){const ly=y(CHART_PRICE);ctx.fillStyle=col;ctx.beginPath();ctx.arc(xa(series.length-1),ly,3,0,7);ctx.fill();}
}

function bindChartEvents(cv){
  cv.onwheel=(e)=>{
    e.preventDefault();
    const series=CHART_SERIES; if(series.length<2) return;
    const a=CHART_VIEW.a, b=CHART_VIEW.b, span=b-a+1;
    const rect=cv.getBoundingClientRect();
    const rel=Math.min(1,Math.max(0,(e.clientX-rect.left)/rect.width));
    const center=a+rel*span;
    const factor=e.deltaY>0?1.25:0.8; // rueda abajo = zoom out
    let nspan=Math.round(span*factor);
    nspan=Math.min(series.length,Math.max(5,nspan));
    let na=Math.round(center-nspan*rel), nb=na+nspan-1;
    if(na<0){na=0;nb=nspan-1;}
    if(nb>=series.length){nb=series.length-1;na=nb-nspan+1;}
    CHART_VIEW={a:Math.max(0,na),b:Math.min(series.length-1,nb)};
    renderChart();
  };
  cv.onmousemove=(e)=>{
    const series=CHART_SERIES; if(!series.length) return;
    const rect=this.getBoundingClientRect?this.getBoundingClientRect():cv.getBoundingClientRect();
    const W=cv.width;
    const rel=Math.min(1,Math.max(0,(e.clientX-rect.left)/rect.width));
    const idx=Math.round(rel*(series.length-1));
    if(idx!==CHART_HOVER){CHART_HOVER=idx;renderChart();}
  };
  cv.onmouseleave=()=>{if(CHART_HOVER!==-1){CHART_HOVER=-1;renderChart();}};
  cv.ondblclick=()=>{CHART_VIEW={a:0,b:CHART_SERIES.length-1};renderChart();};
}

const RT_COLORS=['#C5A059','#5b9dff','#2dd4a7','#a78bfa','#ff6b6b','#f6c453','#4fd1c5','#f78fb3','#9ae66e','#e0bd7d'];
let RT={}; // sym -> [precios]

  const top=scored.slice(0,10);

function drawRT(){
  const cv=document.getElementById('rtCanvas');
  const ctx=cv.getContext('2d');
  const W=cv.width,H=cv.height,padL=8,padR=8,padT=10,padB=18;
  ctx.clearRect(0,0,W,H);
  const syms=Object.keys(RT).filter(s=>RT[s].length>0);
  if(!syms.length){ctx.fillStyle='#56697f';ctx.font='12px monospace';ctx.fillText('esperando datos…',12,30);return;}
  // todos sobre mismo eje Y normalizado por % respecto al primer tick (base 100)
  const series=syms.map(s=>{const b=RT[s][0]||RT[s][RT[s].length-1];return {s,base:b,data:RT[s].map(v=>v/b*100)};});
  let gMin=Infinity,gMax=-Infinity;
  series.forEach(se=>se.data.forEach(v=>{if(v<gMin)gMin=v;if(v>gMax)gMax=v;}));
  if(gMax-gMin<0.1){gMax+=0.5;gMin-=0.5;}
  const n=Math.max(...series.map(se=>se.data.length));
  const x=i=> padL+i/(Math.max(1,n-1))*(W-padL-padR);
  const y=v=> padT+(1-(v-gMin)/(gMax-gMin))*(H-padT-padB);
  // grid
  ctx.strokeStyle='#16202f';ctx.lineWidth=1;
  for(let g=0;g<=4;g++){const yy=padT+g*(H-padT-padB)/4;ctx.beginPath();ctx.moveTo(0,yy);ctx.lineTo(W,yy);ctx.stroke();}
  // línea base 100
  ctx.strokeStyle='#243349';ctx.setLineDash([3,4]);ctx.beginPath();
  const yb=y(100);ctx.moveTo(0,yb);ctx.lineTo(W,yb);ctx.stroke();ctx.setLineDash([]);
  series.forEach((se,si)=>{
    ctx.beginPath();
    se.data.forEach((v,i)=>i?ctx.lineTo(x(i),y(v)):ctx.moveTo(x(i),y(v)));
    ctx.strokeStyle=RT_COLORS[si%RT_COLORS.length];ctx.lineWidth=1.6;ctx.stroke();
  });
  // labels eje Y (%)
  ctx.fillStyle='#56697f';ctx.font='10px monospace';ctx.textAlign='left';
  ctx.fillText('+'+(gMax-100).toFixed(1)+'%',4,padT+9);
  ctx.fillText((gMin-100).toFixed(1)+'%',4,H-padB+2);
  // leyenda
  const lg=document.getElementById('rtLegend');
  lg.innerHTML=series.map((se,si)=>'<span style="display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)"><i style="width:10px;height:3px;background:'+RT_COLORS[si%RT_COLORS.length]+';display:inline-block;border-radius:2px"></i>'+se.s+'</span>').join('');
  document.getElementById('rtStat').textContent='ticks: '+n+' · ventana ~'+(n*60/60).toFixed(0)+' min';
}

// ==================== ASISTENTE IA (paper / Monte Carlo) ====================
let IA={open:false,running:false,paused:false,capital:0,horizon:24,sims:2000,pos:{},equity:0,log:[]};
function abrirAsistente(){IA.open=true;document.getElementById('iaModal').style.display='flex';logIA('Asistente IA abierto. Usa capital SIMULADO.');}
function cerrarAsistente(){IA.open=false;document.getElementById('iaModal').style.display='none';}
function logIA(t){IA.log.unshift('['+new Date().toLocaleTimeString('es-MX')+'] '+t);const el=document.getElementById('iaLog');if(el)el.innerHTML=IA.log.slice(0,40).map(x=>'• '+x).join('<br>');}

// ruido gaussiano (Box-Muller)
function gauss(){let u=0,v=0;while(u===0)u=Math.random();while(v===0)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}

function evaluarAsistente(){
  if(!CURRENT||!CURRENT.length){document.getElementById('iaStatus').textContent='Espera a que cargue el ranking en vivo…';return;}
  IA.capital=parseFloat(document.getElementById('iaCapital').value)||1000;
  IA.horizon=parseInt(document.getElementById('iaHorizon').value)||24;
  IA.sims=parseInt(document.getElementById('iaSims').value)||2000;
  IA.equity=IA.capital; IA.pos={}; IA.paused=false;
  const top=CURRENT.slice(0,10);
  // parametros por activo desde datos reales
  const params=top.map(d=>{
    const volD=(Math.abs(pct(d.price_change_percentage_7d_in_currency))+0.5*Math.abs(pct(d.price_change_percentage_30d_in_currency))||Math.abs(pct(d.price_change_percentage_24h_in_currency))||1);
    const dailyVol=volD/100/ Math.sqrt(1); // aproximacion vol diaria desde 7d
    const drift=(pct(d.price_change_percentage_24h_in_currency)||0)/100/24; // drift por hora desde 24h
    return {sym:d.symbol.toUpperCase(),price:d.current_price,vol:Math.max(0.005,dailyVol/ Math.sqrt(24)||0.02),drift:drift,score:d.score100};
  });
  // Monte Carlo: simula precio a horizonte (en pasos de 1h)
  const steps=IA.horizon;
  const finalRet=[]; // retorno % por simulacion (cartera igual-pond)
  for(let s=0;s<IA.sims;s++){
    let acc=0;
    for(const p of params){ // peso igual
      let price=p.price;
      for(let h=0;h<steps;h++){ price*= (1+p.drift + p.vol*gauss()); }
        const r=(price-p.price)/p.price; acc+=r;
    }
    finalRet.push(acc/params.length*100);
  }
  finalRet.sort((a,b)=>a-b);
  const pctAt=q=>finalRet[Math.min(IA.sims-1,Math.floor(q*IA.sims))];
  const probWin=finalRet.filter(r=>r>0).length/IA.sims*100;
  const p5=pctAt(0.05),p50=pctAt(0.5),p95=pctAt(0.95);
  const mean=finalRet.reduce((a,b)=>a+b,0)/IA.sims;
  // asignacion sugerida: peso ~ score normalizado
  const tot=params.reduce((a,p)=>a+p.score,0);
  params.forEach(p=>{IA.pos[p.sym]=IA.capital*(p.score/tot);});
  // render resultado
  document.getElementById('iaResult').innerHTML=
    '<div class="big">Prob. de ganancia: '+probWin.toFixed(1)+'%</div>'+
    '<div style="color:var(--muted);font-size:12px;margin-top:4px">Banda 5–95% a '+IA.horizon+'h · sims='+IA.sims.toLocaleString()+'</div>'+
    '<div class="grid">'+
      '<div class="cell"><b class="down">'+p5.toFixed(1)+'%</b><span>Peor 5%</span></div>'+
      '<div class="cell"><b>'+p50.toFixed(1)+'%</b><span>Mediana</span></div>'+
      '<div class="cell"><b class="up">'+p95.toFixed(1)+'%</b><span>Mejor 5%</span></div>'+
      '<div class="cell"><b>'+mean.toFixed(1)+'%</b><span>Esperado</span></div>'+
    '</div>'+
    '<div style="font-size:12px;color:var(--muted)">Asignación simulada sugerida (por score): '+Object.entries(IA.pos).map(([k,v])=>k+' $'+v.toFixed(0)).join(' · ')+'</div>';
  dibujarDistIA(finalRet);
  document.getElementById('iaStatus').textContent='✅ Evaluado. Control PAPER activo. El agente rebalancea según señales.';
  logIA('Evaluado: prob.ganancia '+probWin.toFixed(1)+'%, banda['+p5.toFixed(1)+','+p95.toFixed(1)+']%. Capital $'+IA.capital);
  // iniciar ciclo de control
  IA.running=true;
  if(!IA._timer) iaLoop();
}
function iaLoop(){
  if(!IA.running){IA._timer=null;return;}
  if(IA.open && !IA.paused && CURRENT.length){
    // rebalanceo simple: si un activo del Top10 cae de score, el agente "mueve" peso a uno mejor (solo simulado)
    const top=CURRENT.slice(0,10);
    const tot=top.reduce((a,d)=>a+d.score100,0);
    let eq=IA.equity;
    top.forEach(d=>{const w=d.score100/tot; IA.pos[d.symbol.toUpperCase()]=eq*w;});
    const best=top[0];
    logIA('Control: equity $'+eq.toFixed(0)+' · mayor peso → '+best.symbol.toUpperCase()+' (score '+best.score100.toFixed(1)+')');
  }
  IA._timer=setTimeout(iaLoop, 5000);
}
function togglePausa(){
  IA.paused=!IA.paused;
  const b=document.getElementById('iaPauseBtn');
  b.textContent=IA.paused?'▶ Reanudar':'⏸ Pausa';
  b.classList.toggle('ia-paused',IA.paused);
  logIA(IA.paused?'⏸ PAUSA: agente detiene rebalanceo (capital simulado congelado).':'▶ REANUDAR: agente retoma control.');
  document.getElementById('iaStatus').textContent=IA.paused?'⏸ Pausado (paper).':'✅ Control PAPER activo.';
}
function retiro(){
  IA.running=false; if(IA._timer){clearTimeout(IA._timer);IA._timer=null;}
  const ret=IA.equity;
  logIA('💸 RETIRO (simulado): retiras $'+ret.toFixed(2)+' de capital ficticio. Agente detenido.');
  document.getElementById('iaStatus').textContent='💸 Retiro simulado: $'+ret.toFixed(2)+'. Agente detenido.';
  document.getElementById('iaResult').innerHTML+='<div style="margin-top:10px;padding:10px;border:1px solid var(--gold);border-radius:9px;color:var(--gold)">Retiro PAPER: $'+ret.toFixed(2)+' (no es dinero real). ¿Conectar a exchange real? Requiere tus API keys + riesgo explícito.</div>';
}
function dibujarDistIA(arr){
  const cv=document.getElementById('iaCanvas');if(!cv)return;
  const ctx=cv.getContext('2d');const W=cv.width,H=cv.height,padB=20,padT=10;
  // histograma
  const bins=40,min=Math.min(...arr),max=Math.max(...arr);
  const h=new Array(bins).fill(0);
  arr.forEach(v=>{let i=Math.floor((v-min)/(max-min||1)*(bins-1));h[i]++;});
  const mx=Math.max(...h);
  ctx.clearRect(0,0,W,H);
  const bw=W/bins;
  for(let i=0;i<bins;i++){
    const x=i*bw, hh=(h[i]/mx)*(H-padB-padT);
    const v=min+(i+0.5)/bins*(max-min);
    ctx.fillStyle= v>=0?'rgba(45,212,167,.7)':'rgba(255,107,107,.7)';
    ctx.fillRect(x,H-padB-hh,bw-1,hh);
  }
  // linea cero
  if(min<0&&max>0){const zx=padT+(0-min)/(max-min)*(H-padB-padT);ctx.strokeStyle='#56697f';ctx.beginPath();ctx.moveTo(0,zx);ctx.lineTo(W,zx);ctx.stroke();}
  ctx.fillStyle='#56697f';ctx.font='10px monospace';ctx.fillText('Retorno % (distribución Monte Carlo)',4,padT+9);
}
</script>
<div id="iaModal" class="ia-modal" style="display:none">
  <div class="ia-backdrop" onclick="cerrarAsistente()"></div>
  <div class="ia-panel">
    <div class="ia-head">
      <h2>🤖 Asistente IA de Inversión <span class="ia-tag">SIMULACIÓN · no mueve dinero real</span></h2>
      <button class="ia-x" onclick="cerrarAsistente()">✕</button>
    </div>
    <div class="ia-body">
      <div class="ia-controls">
        <label>Capital simulado: $<input id="iaCapital" type="number" value="1000" min="10" step="10"></label>
        <label>Horizonte: <select id="iaHorizon"><option value="24">24h</option><option value="72">3 días</option><option value="168">7 días</option></select></label>
        <label>Simulaciones: <select id="iaSims"><option value="2000">2,000</option><option value="5000">5,000</option><option value="10000">10,000</option></select></label>
        <button class="btn-ia" onclick="evaluarAsistente()">▶ Evaluar y tomar control (paper)</button>
        <button id="iaPauseBtn" onclick="togglePausa()">⏸ Pausa</button>
        <button id="iaRetiroBtn" onclick="retiro()">💸 Retiro</button>
      </div>
      <div id="iaStatus" class="ia-status">Listo. Define capital y pulsa Evaluar.</div>
      <div id="iaResult" class="ia-result"></div>
      <canvas id="iaCanvas" width="900" height="220" style="width:100%;height:220px;background:#0a1019;border:1px solid var(--line);border-radius:9px;margin-top:10px"></canvas>
      <div id="iaLog" class="ia-log"></div>
      <p class="ia-warn">⚠ El Asistente IA usa <b>Monte Carlo real</b> (miles de trayectorias con volatilidad y momentum actuales). Entrega <b>probabilidad de ganancia y banda 5–95%</b>, NO certeza ni "solo ganancias". Control = paper trading sobre capital ficticio. Conectar a un exchange real requiere tus llaves API y tu riesgo explícito.</p>
    </div>
  </div>
</div>
